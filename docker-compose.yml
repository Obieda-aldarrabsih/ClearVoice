version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clearvoice-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: clearvoice
    ports:
      - "5432:5432"
    volumes:
      - clearvoice_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  clearvoice_pgdata:
